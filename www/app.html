<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1,minimum-scale=1">
<meta name="theme-color" content="#FFF4E8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>알림봄</title>
<style>
:root{
  --bg:#FFF8F0; --card:#FFFFFF; --ink:#3B2F2A; --sub:#7A6A62; --line:#F0E2D3;
  --orange:#FF9B54; --orange-l:#FFE6D0;
  --mint:#5FC3A5; --mint-l:#DDF4EC;
  --purple:#9C86E0; --purple-l:#E9E3FA;
  --warn:#E8564A; --fs:18px; --nav:rgba(255,248,240,.96); --chipink:#216B58; --on:#fff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1E1814;--card:#2A221D;--ink:#F6EBE0;--sub:#B9A89C;--line:#43372F;--orange:#F2893F;--orange-l:#4A3022;--mint:#4DB394;--mint-l:#1F3A32;--purple:#8D78D6;--purple-l:#352E4F;--warn:#F06A5E;--nav:rgba(30,24,20,.96);--chipink:#A5E6D2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1E1814;--card:#2A221D;--ink:#F6EBE0;--sub:#B9A89C;--line:#43372F;--orange:#F2893F;--orange-l:#4A3022;--mint:#4DB394;--mint-l:#1F3A32;--purple:#8D78D6;--purple-l:#352E4F;--warn:#F06A5E;--nav:rgba(30,24,20,.96);--chipink:#A5E6D2;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{word-break:keep-all;overflow-wrap:break-word;margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:var(--fs);line-height:1.45}
body{display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
header.top{padding:14px 2px 12px;display:flex;align-items:center;gap:10px}
header.top h1{margin:0;font-size:1.25em;flex:1}
header.top .back{width:48px;height:48px;flex:none;padding:0;display:flex;align-items:center;justify-content:center;border-radius:14px;background:var(--card);border:2px solid var(--line);color:var(--ink)}
header.top .back svg{width:24px;height:24px;display:block}
.chip{background:var(--mint-l);color:var(--chipink);border-radius:999px;padding:6px 12px;font-size:.78em;font-weight:700;white-space:nowrap}
main{flex:1;overflow-y:auto;padding:4px 2px 110px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}
.big-alert{background:var(--orange-l);border:2px solid var(--orange);border-radius:24px;padding:16px;margin-bottom:16px}
.big-alert h2{margin:0 0 6px;font-size:1.05em}
.big-alert .sum{font-size:1.05em;font-weight:700}
.row{display:flex;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{border-radius:26px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;position:relative;min-height:128px;justify-content:center;border:2px solid transparent}
.tile .ic{font-size:2.6em;line-height:1}
.tile .badge{position:absolute;top:10px;right:12px;background:var(--warn);color:#fff;border-radius:999px;min-width:26px;height:26px;font-size:.75em;display:flex;align-items:center;justify-content:center;padding:0 7px}
.t-o{background:var(--orange-l)}.t-m{background:var(--mint-l)}.t-p{background:var(--purple-l)}
.btn{border-radius:18px;padding:14px 18px;font-weight:800;background:var(--orange);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px}
.btn.m{background:var(--mint)}.btn.p{background:var(--purple)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.block{width:100%}
.btn.sm{min-height:44px;padding:8px 14px;font-size:.85em}
.speak{width:58px;height:58px;border-radius:50%;background:var(--purple);color:#fff;font-size:26px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;flex:none}
.speak>*{display:block}
.speak.on{background:var(--warn)}
.item h3{margin:0 0 4px;font-size:1.05em}
.item .meta{color:var(--sub);font-size:.78em}
.item .sum{background:var(--mint-l);border-radius:14px;padding:8px 12px;margin:8px 0;font-weight:700}
.item .body{white-space:pre-wrap;color:var(--ink)}
.item img.pic{width:100%;border-radius:16px;margin-top:8px}
.aac{font-size:2.2em;width:58px;height:58px;line-height:1;border-radius:18px;background:var(--orange-l);display:flex;align-items:center;justify-content:center;flex:none}
label.f{display:block;font-weight:800;margin:12px 0 6px;font-size:.9em}
.in{width:100%;border:2px solid var(--line);border-radius:16px;padding:13px 14px;background:var(--card)}
textarea.in{min-height:110px;resize:vertical}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{font-size:1.6em;width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card)}
.pick button.sel{border-color:var(--orange);background:var(--orange-l)}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:2px solid var(--line);border-radius:16px;padding:12px 6px;background:var(--card);font-weight:800}
.seg button.sel{border-color:var(--mint);background:var(--mint-l)}
.nav{position:absolute;left:0;right:0;bottom:0;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--nav);border-top:2px solid var(--line);display:flex;gap:10px}
.nav button{font-size:13px!important;white-space:nowrap;flex:1;border-radius:18px;background:var(--card);border:2px solid var(--line);padding:8px 4px;display:flex;flex-direction:column;align-items:center;font-size:.72em;font-weight:800;gap:2px;min-height:58px}
.nav button .e{font-size:1.7em;line-height:1}
.check{display:flex;align-items:center;gap:10px;font-weight:800;padding:12px 14px;border-radius:16px;border:2px solid var(--line);margin-top:10px;width:100%;background:var(--card)}
.check .box{width:30px;height:30px;border-radius:9px;border:3px solid var(--orange);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1em;flex:none}
.check.done{background:var(--mint-l);border-color:var(--mint)}
.check.done .box{background:var(--mint);border-color:var(--mint)}
.tt{width:100%;border-collapse:separate;border-spacing:4px;font-size:.78em;text-align:center;table-layout:fixed}
.tt th{background:var(--purple-l);border-radius:10px;padding:6px 2px}
.tt td{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 2px;min-height:42px;word-break:keep-all}
.tt td.today,.tt th.today{background:var(--orange-l);border-color:var(--orange)}
.empty{text-align:center;color:var(--sub);padding:34px 10px}
.empty .e{font-size:3em}
.popup{position:fixed;inset:0;background:rgba(40,25,15,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:14px}
.popup .box{background:var(--card);border-radius:28px;max-width:540px;width:100%;padding:20px;border:3px solid var(--orange);animation:up .25s ease-out;display:flex;flex-direction:column;max-height:100%;overflow-y:auto}
.popup .box>*{flex:none}
.popup .box>ul{flex:0 1 auto;overflow-y:auto;min-height:60px;-webkit-overflow-scrolling:touch}
.popup .btn{min-height:58px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.popup h2{margin:0 0 4px;font-size:1.1em}
.popup ul{padding-left:0;list-style:none;margin:10px 0}
.popup li{background:var(--orange-l);border-radius:14px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;font-weight:700}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#3B2F2A;color:#fff;padding:12px 18px;border-radius:999px;font-size:.85em;z-index:60;max-width:90%}
.hello{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.hello .logo{width:54px;height:54px;border-radius:18px;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:1.9em}
.small{font-size:.78em;color:var(--sub)}
.sec-h{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.05em;margin:0 0 10px}
.sec-h .si{font-size:1.7em;line-height:1}
.pseg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pseg button{position:relative;min-height:104px;border-radius:22px;border:3px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 2px;font-weight:800}
.pseg button .g{font-size:2.3em;line-height:1.1;font-weight:900}
.pseg button .l{font-size:.78em}
.pseg button.sel{border-color:var(--mint);background:var(--mint-l)}
.pseg button.sel::after{content:'✓';position:absolute;top:6px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--mint);color:#fff;font-size:.8em;display:flex;align-items:center;justify-content:center}
.rem{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.rem button{flex:1;display:flex;align-items:center;gap:12px;border-radius:22px;border:3px solid var(--line);background:#fff;padding:10px 14px;font-weight:800;text-align:left;min-height:72px}
.rem button .g{font-size:1.9em;line-height:1;width:1.3em;text-align:center;flex:none}
.rem .nmw{display:flex;flex-direction:column;gap:2px;min-width:0;line-height:1.25}
.rem .nmw b{font-weight:900}
.rem .nmw small{font-size:.75em;font-weight:700;color:var(--sub)}
.rem button.on{border-color:var(--mint);background:var(--mint-l)}
.rem button .st{margin-left:auto;font-size:.8em;white-space:nowrap}
.rem button span:nth-child(2){flex:1}
.rem .rr{display:flex;flex-direction:column;gap:6px}
.rem .ren{border:3px solid var(--line);border-radius:22px;background:#fff;font-weight:800;padding:12px 14px;min-height:56px;width:100%;font-size:.9em}
.rem .rr input{width:100%;min-height:56px}
.card{min-width:0}
.tm{position:relative;display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border:3px solid var(--line);border-radius:22px;background:#fff;font-weight:800;text-align:center}
.tm .tv{pointer-events:none;text-align:center}
.rem .tm input{position:absolute;left:0;top:0;width:100%;height:100%;min-height:0;opacity:0;border:0;padding:0;margin:0;cursor:pointer}
.rem,.rem .rr,.rem button,.rem .ren,.rem input{box-sizing:border-box;max-width:100%;min-width:0}
.rem input[type=time]{-webkit-appearance:none;appearance:none;display:block;text-align:center;margin:0}
.rem input[type=time]::-webkit-date-and-time-value{text-align:center;margin:0 auto}
.rem input[type=time]::-webkit-datetime-edit{padding:0}
.rem input{width:100%;font-size:1em;border:3px solid var(--line);border-radius:22px;padding:6px 10px;background:#fff;font-weight:800}
.bigact{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigact button{border-radius:22px;border:3px solid var(--line);background:#fff;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800}
.bigact button .g{font-size:2.3em;line-height:1.1}
.wc{border:2px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px;background:#fff}
a.btn{text-decoration:none;text-align:center}
.wc a.btn{white-space:nowrap}
.nw{display:block;text-decoration:none;color:inherit;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.nw b{display:block;font-size:.95em}
.nw span{font-size:.75em;color:var(--sub)}
.chipbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chipbar button{border:3px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:800}
.chipbar button.sel{border-color:var(--purple);background:var(--purple-l)}
.modebar{display:flex;gap:8px;padding:0 18px 10px}
.modebar button{flex:1;border-radius:16px;padding:12px 6px;font-weight:900;border:2px solid var(--line);background:#fff;min-height:48px}
.modebar button.on.par{background:var(--orange);border-color:var(--orange);color:#fff}
.modebar button.on.tea{background:var(--purple);border-color:var(--purple);color:#fff}
hr.s{border:0;border-top:2px dashed var(--line);margin:16px 0}
.ni{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.ni .nia{display:block;text-decoration:none;color:inherit;flex:1;min-width:0}
.ni .nia b{display:block;font-size:.95em;margin:4px 0;line-height:1.35}
.ni .nm{font-size:.75em;color:var(--sub)}
.ni .dl{margin-top:6px;font-size:.8em;font-weight:900;color:var(--orange)}
.tg{display:inline-block;font-size:.7em;font-weight:900;border-radius:999px;padding:2px 9px;margin:0 4px 2px 0;background:var(--line)}
.tg.c{background:var(--purple-l)}.tg.o{background:var(--mint-l)}.tg.x{background:#eee;color:#777}.tg.n{background:var(--orange);color:#fff}.tg.p{background:#ffd9d4;color:#c0392b}
textarea.in{width:100%;box-sizing:border-box}

/* ---------- 좌우 흔들림 / 큰 글자 넘침 방지 (삼성 APK 대응) ---------- */
html,body{max-width:100%;overflow-x:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:pan-y}
body{width:100%;position:relative}
#app{min-width:0;overflow:hidden;touch-action:pan-y}
main{min-width:0;overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-y}
main>*,.card,.item,.row,.rem,.wc{min-width:0;max-width:100%}
.card,.item,.btn,.tile,.chip{overflow-wrap:anywhere}
.btn{max-width:100%}
.pseg{grid-template-columns:repeat(3,minmax(0,1fr))}
.pseg button{min-width:0;overflow:hidden;padding:8px 2px}
.pseg button .g{font-size:min(2.3em,40px)}
.pseg button .l{max-width:100%;text-align:center;line-height:1.2;white-space:normal}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.bigact{grid-template-columns:repeat(2,minmax(0,1fr))}
.bigact button{min-width:0;padding:8px 4px;text-align:center}
.tile{min-width:0;text-align:center}
.seg button,.modebar button,.chipbar button{min-width:0}
.nav{gap:6px;padding-left:8px;padding-right:8px;overflow:hidden}
.nav button{min-width:0;white-space:normal;text-align:center;line-height:1.2;font-size:12px!important;padding:8px 2px;overflow:hidden}
.nav button .e{font-size:22px}
.tt{max-width:100%}
img,video,canvas,svg{max-width:100%}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ================= 알림봄 (프로토타입) =================
   - 모든 데이터는 이 기기(localStorage)에만 저장됩니다. 서버 연동/푸시는 미구현.
   - TTS: 웹=speechSynthesis, APK=Capacitor TextToSpeech 플러그인
*/
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY = 'alrimbom.v1';
const DAYS = ['월','화','수','목','금'];
const ICONS = ['📢','🎒','📚','✏️','🧴','🍱','🧃','👕','☂️','🚌','🎨','⚽','📝','💊','📷','🗓️','💰','🏥','🎵','🌳'];

const todayStr = (d=new Date()) => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays = n => { const d=new Date(); d.setDate(d.getDate()+n); return todayStr(d); };

function seed(){
  return {
    role:null, child:null, className:'햇살반',
    settings:{ disp:{parent:{fs:0,rate:1,vol:1},teacher:{fs:0,rate:1,vol:1}},
      remind:{work:true,eve:true,bed:false}, workTime:'18:00', eveTime:'20:00', bedTime:'21:30',
      tRemind:{leave:true,home:true,wake:false,pre:true}, tLeave:'17:30', tHome:'19:00', tWake:'07:00', tPre:'08:00' },
    items:{
      notice:[
        {id:1,icon:'📢',title:'다음 주 현장체험학습 안내',body:'10월 22일(수) 안양예술공원으로 현장체험학습을 갑니다.\n오전 9시까지 등교해 주세요.\n도시락과 물을 챙겨 주세요. 동의서는 20일(월)까지 제출해 주세요.',summary:'22일(수) 현장체험학습. 도시락·물 준비, 동의서는 20일까지 제출.',date:todayStr(),done:false},
        {id:2,icon:'💊',title:'환절기 건강 안내',body:'일교차가 큽니다. 얇은 겉옷을 챙겨 주세요. 감기 증상이 있으면 등원 전에 알려 주세요.',summary:'일교차가 커요. 겉옷을 챙겨 주세요.',date:addDays(-1),done:false}
      ],
      supply:[
        {id:3,icon:'🎒',title:'내일 준비물',body:'색연필 12색\n물티슈 1팩\n실내화 (금요일 세탁 후 가져오기)\n체육복',summary:'색연필, 물티슈, 실내화, 체육복',date:addDays(1),done:false}
      ],
      letter:[
        {id:4,icon:'📝',title:'10월 가정통신문',body:'10월 학교 행사 일정과 방과후 학교 신청 안내입니다.\n방과후 신청은 25일까지 제출해 주세요.',summary:'방과후 신청서 25일까지 제출.',date:addDays(-3),done:false}
      ],
      photo:[],
      welfare:[{id:6,center:'안양시관악장애인종합복지관',title:'[예시] 가을 가족 프로그램 안내',body:'예시로 넣어 둔 글이에요. 돌봄교사 모드의 “소식 올리기”에서 실제 소식으로 바꿔 올려 주세요.',date:todayStr()}],
      meal:[{id:5,date:todayStr(),menu:'잡곡밥, 미역국, 닭갈비, 배추김치, 사과',img:null}]
    },
    timetable:{
      periods:['1교시','2교시','3교시','4교시','5교시'],
      cells:[['국어','수학','국어','통합','체육'],['수학','국어','통합','수학','음악'],['통합','체육','수학','국어','통합'],['통합','통합','미술','창체','국어'],['','','','','']]
    },
    nextId:100
  };
}
let S;
function load(){ try{ const r=localStorage.getItem(KEY); S = r? JSON.parse(r) : seed(); }catch(e){ S=seed(); } S.items=S.items||{}; S.items.meal=S.items.meal||[]; S.items.welfare=S.items.welfare||[]; if(!S.centers) S.centers=[]; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('저장 공간이 부족해요. 사진을 줄여 주세요.'); } }
load();
const RATES=[.5,1,2];
const SAMPLE='오늘 준비물은 색연필, 물티슈, 실내화, 체육복입니다.';
function norm(){
  const def=seed().settings; const st=S.settings=S.settings||{};
  Object.keys(def).forEach(k=>{ if(st[k]===undefined) st[k]=JSON.parse(JSON.stringify(def[k])); });
  if(!st.tRemind) st.tRemind=def.tRemind;
  if(!st.disp){ st.disp={parent:{fs:st.fs??0,rate:st.rate??1,vol:st.vol??1},teacher:{fs:0,rate:1,vol:1}}; }
  ['parent','teacher'].forEach(r=>{ const d=st.disp[r]=st.disp[r]||{fs:0,rate:1,vol:1};
    d.rate=RATES.reduce((a,b)=>Math.abs(b-d.rate)<Math.abs(a-d.rate)?b:a);
    if(![0,1,2].includes(d.fs)) d.fs=0; if(d.vol==null) d.vol=1; });
}
norm();

function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function autoSummary(text){
  const lines = String(text).split(/\n+/).map(s=>s.trim()).filter(Boolean);
  if(!lines.length) return '';
  const joined = lines.join(' ');
  if(joined.length<=60) return joined;
  const first = joined.split(/(?<=[.!?。])\s+/)[0];
  return (first.length>70 ? first.slice(0,68)+'…' : first);
}

// APK(안드로이드 앱)에서는 WebView에 웹 음성 기능이 없어서 기기 내장 TTS 플러그인을 사용
const nativeTTS=()=>{ try{ const C=window.Capacitor; return (C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.TextToSpeech)||null; }catch(e){ return null; } };
const fmtT=v=>{ const m=/^(\d{1,2}):(\d{2})/.exec(v||''); if(!m) return v||'--:--'; let h=+m[1]; const ap=h>=12?'오후':'오전'; h=h%12||12; return ap+' '+h+':'+m[2]; };
// 카카오톡·네이버 등 앱 안의 간이 브라우저(안드로이드)는 음성 읽기를 막아 두어서, 크롬 등 기본 브라우저로 열도록 안내
const IN_APP=()=>{ const u=navigator.userAgent||''; return /Android/i.test(u)&&!nativeTTS()&&(/KAKAOTALK|NAVER\(inapp|FBAN|FBAV|Instagram|DaumApps|Line\//i.test(u)||/; wv\)/.test(u)); };
function openExternal(){
  const u=location.href.split('#')[0];
  if(/KAKAOTALK/i.test(navigator.userAgent)){ location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(u); return; }
  try{ const x=new URL(u); location.href='intent://'+x.host+x.pathname+x.search+'#Intent;scheme='+x.protocol.replace(':','')+';package=com.android.chrome;end'; }catch(e){ toast('오른쪽 위 ⋮ 메뉴에서 “다른 브라우저로 열기”를 눌러 주세요'); }
}
const inAppBanner=()=>IN_APP()?`<div class="card" style="padding:12px;border-color:var(--orange)"><div style="font-weight:900">🔊 소리 읽기가 필요하면</div><p class="small" style="margin:4px 0 8px">지금 보는 화면(카카오톡 등 앱 안의 브라우저)에서는 소리 읽기가 안 돼요.</p><button class="btn block" data-a="openext">크롬 등 기본 브라우저로 열기</button></div>`:'';
async function inAppAsk(){ if(await ask('이 화면(앱 안의 브라우저)에서는 소리 읽기가 안 돼요. 크롬 등 기본 브라우저로 열까요?')) openExternal(); }
function stopSpeak(){ speakTok++; const n=nativeTTS(); if(n){ try{ n.stop().catch(()=>{}); }catch(e){} } try{ window.speechSynthesis&&speechSynthesis.cancel(); }catch(e){} }
function koVoices(){ try{ return speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().replace('_','-').startsWith('ko')); }catch(e){ return []; } }
// 구글 온라인 음성은 속도 조절을 무시하므로, 기기 내장(localService) 음성을 우선 사용
function pickVoice(){ const vs=koVoices(); return vs.find(v=>v.localService)||vs.find(v=>!/google/i.test(v.name))||vs[0]; }
if('speechSynthesis' in window){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{ if(route.p==='settings') render(); }; }
function voiceNote(){ if(nativeTTS()) return '<p class="small" style="margin:10px 0 0">사용 중인 음성: 이 기기의 기본 한국어 음성<br>(탭 설정 → 일반 → 텍스트 음성 변환 출력에서 바꿀 수 있어요)</p>'; const v=pickVoice(); if(!v) return '<p class="small" style="margin:10px 0 0">이 기기의 한국어 음성을 찾지 못했어요.</p>';
  const g=/google/i.test(v.name)&&!v.localService;
  return `<p class="small" style="margin:10px 0 0">사용 중인 음성: ${esc(v.name)}${g?'<br>⚠️ 이 음성은 속도가 바뀌지 않을 수 있어요. 폰이나 다른 브라우저(Edge 등)에서 확인해 보세요.':''}</p>`; }
function speak(text,id){
  const nat=nativeTTS();
  if(!nat && IN_APP()){ inAppAsk(); return; }
  if(!nat && !('speechSynthesis' in window)){ toast('이 기기에서는 음성 읽기를 지원하지 않아요.'); return; }
  if(speakingId===id && id!=='test'){ stopSpeak(); speakingId=null; render(); return; }
  stopSpeak();
  const tok=speakTok, done=()=>{ if(tok!==speakTok) return; speakingId=null; render(); };
  speakingId=id;
  if(nat){
    nat.speak({text,lang:'ko-KR',rate:D().rate,pitch:1,volume:D().vol,category:'ambient'}).then(done,e=>{ if(tok===speakTok){ toast('음성을 재생하지 못했어요. 기기의 한국어 음성 설치를 확인해 주세요.'); } done(); });
    render(); return;
  }
  const synth=window.speechSynthesis;
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ko-KR'; u.rate=D().rate; u.volume=D().vol;
  const v=pickVoice(); if(v) u.voice=v;
  u.onend=u.onerror=done;
  synth.speak(u); render();
}

  const ph=S.items.photo;
  if(!ph.length) return add+`<div class="empty"><div class="e">📷</div>아직 사진이 없어요</div>`;
  return add+ph.slice().reverse().map(p=>`<div class="card item"><img class="pic" style="margin:0" src="${p.img}" alt="${esc(p.title)}"><h3 style="margin-top:10px">${esc(p.title)}</h3><div class="meta">${esc(p.date)}</div>${S.role==='teacher'?`<div class="row" style="margin-top:8px"><button class="btn ghost sm" data-pedit="${p.id}">✏️ 수정</button><button class="btn ghost sm" data-del="photo:${p.id}">🗑 삭제</button></div>`:''}</div>`).join('');
}

/* ---------- 시간표 ---------- */
function viewTimetable(){
  const tt=S.timetable; const dow=new Date().getDay()-1;
  const edit=S.role==='teacher';
  let h=`<div class="card"><table class="tt"><tr><th></th>${DAYS.map((d,i)=>`<th class="${i===dow?'today':''}">${d}</th>`).join('')}</tr>`;
  tt.periods.forEach((p,r)=>{ h+=`<tr><th>${p.replace('교시','')}</th>${DAYS.map((d,c)=>`<td class="${c===dow?'today':''}" ${edit?`data-cell="${r}:${c}"`:''}>${esc(tt.cells[r][c])||'&nbsp;'}</td>`).join('')}</tr>`; });
  h+=`</table></div>`;
  h+= edit? `<p class="small">칸을 눌러 과목을 바꿀 수 있어요.</p>` : `<button class="btn m block" data-speak="tt">${speakingId==='tt'?'⏹ 멈추기':'🔊 오늘 시간표 읽어주기'}</button>`;
  return h;
}
const ttText=()=>{ const d=new Date().getDay()-1; if(d<0||d>4) return '오늘은 수업이 없는 날이에요.'; return '오늘 시간표입니다. '+S.timetable.periods.map((p,r)=>S.timetable.cells[r][d]?`${p} ${S.timetable.cells[r][d]}`:'').filter(Boolean).join(', '); };

  document.querySelectorAll('[data-wcedit]').forEach(b=>b.onclick=()=>{ const c=S.centers.find(x=>x.id==b.dataset.wcedit); if(!c) return; const bs=boardsOf(c); cDraft={id:c.id,name:c.name,notice:(bs.find(x=>x.k==='notice')||{}).url||'',recruit:(bs.find(x=>x.k==='recruit')||{}).url||'',job:(bs.find(x=>x.k==='job')||{}).url||''}; render(); });
  document.querySelectorAll('[data-wdel]').forEach(b=>b.onclick=async()=>{ if(!await ask('이 복지관을 목록에서 뺄까요? (학부모 화면에서도 사라져요)')) return; S.centers=S.centers.filter(c=>c.id!=b.dataset.wdel); wFilter=''; cDraft={}; save(); render(); });
  const pef=$('#pef'); if(pef) pef.onchange=()=>{ readPhotoDraft(); shrinkFile(pef.files[0],d=>{ photoDraft.img=d; render(); }); };
  const psave=$('#psave'); if(psave) psave.onclick=savePhotoEdit;
  const wsave=$('#wsave'); if(wsave) wsave.onclick=saveW;
  const plsave=$('#plsave'); if(plsave) plsave.onclick=savePaste;

    if(s) s.textContent=n?`✅ 글 링크 ${n}개를 찾았어요`:(h?'⚠️ 복사된 내용에서 글 링크를 찾지 못했어요. 글을 눌러도 게시판으로 가요':'⚠️ 이 브라우저는 링크를 같이 복사하지 못했어요. 글을 눌러도 게시판으로 가요'); });

function readDraft(){ const g=id=>document.getElementById(id); if(g('ft')){ draft.title=g('ft').value; draft.body=g('fb').value; draft.summary=g('fs').value; draft.date=g('fd').value; } }
function saveForm(t){
  readDraft();
  if(!draft.title?.trim()){ toast('제목을 입력해 주세요'); return; }
  if(!draft.body?.trim()){ toast('내용을 입력해 주세요'); return; }
  const rec={icon:draft.icon,title:draft.title.trim(),body:draft.body.trim(),summary:(draft.summary||'').trim()||autoSummary(draft.body),date:draft.date||todayStr()};
  if(draft.editId){ const it=S.items[t].find(x=>x.id===draft.editId);
    if(it){ const changed=it.title!==rec.title||it.body!==rec.body; Object.assign(it,rec); if(changed) it.done=false; } toast('수정했어요'); }
  else { S.items[t].push({id:S.nextId++,...rec,done:false}); toast('등록했어요'); }
  save(); draft={icon:'📢'}; go('list',{t});
}
async function addPhoto(file){
  if(!file) return;
  const title=await ask('사진 제목 (예: 가을 소풍)',{input:1,value:'활동 사진'}); if(title===null) return;
  const img=new Image(), url=URL.createObjectURL(file);
  img.onload=()=>{ const max=900, k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=img.width*k; c.height=img.height*k; c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
    S.items.photo.push({id:S.nextId++,title:title||'활동 사진',date:todayStr(),img:c.toDataURL('image/jpeg',.7)}); save(); render(); };
  img.onerror=()=>toast('사진을 불러오지 못했어요');
  img.src=url;
}
async function action(a,b){
  if(a==='home') go('home');
  else if(a==='back'){ if(route.p==='form') go('list',{t:route.t}); else if(route.p==='mealform') go('list',{t:'meal'}); else if(route.p==='photoform') go('list',{t:'photo'}); else if(route.p==='wform'||route.p==='pform') go('list',{t:'welfare'}); else go('home'); }
  else if(a==='waddc'){ addCenter(); }
  else if(a==='openext'){ openExternal(); }
  else if(a==='wnew'){ wDraft={center:wFilter||(allCenters()[0]||{}).name||'',title:'',body:'',date:todayStr()}; go('wform'); }
  else if(a==='wcancel'){ cDraft={}; render(); }
  else if(a==='wshare'){ shareExport(); }
  else if(a==='wpaste'){ pDraft={key:b.dataset.key,text:'',html:''}; go('pform'); }
  else if(a==='pclear'){ if(S.snaps) delete S.snaps[pDraft.key]; save(); toast('지웠어요'); go('list',{t:'welfare'}); }
  else if(a==='mealform'){ mealDraft={date:todayStr(),menu:'',img:null}; go('mealform'); }
  else if(a==='form'){ draft={icon:'📢'}; go('form',{t:b.dataset.t}); }
  else if(a==='popup') { maybePopup(); }
  else if(a==='popclose'){ $('#pop')?.remove(); stopSpeak(); speakingId=null; go('list',{t:pending()[0]?.type||'notice'}); }
  else if(a==='testvoice'){ speak('알림봄입니다. 이 속도와 크기로 읽어 드려요. '+SAMPLE,'test'); }
  else if(a==='settingsgo'){ go('settings'); }
  else if(a==='tpreview'){ teacherPopup(); }
  else if(a==='tpopclose'){ $('#pop')?.remove(); stopSpeak(); speakingId=null; }
  else if(a==='readall'){
    if(S.role==='parent'){ const p=pending(); speak(p.length?'오늘 확인할 알림입니다. '+p.map(i=>`${i.title}. ${i.summary||autoSummary(i.body)}`).join(' '):'확인할 알림이 없어요.','all'); }
    else speak(ttText(),'all');
  }
  else if(a==='aac'){ document.body.insertAdjacentHTML('beforeend',`<div class="popup" id="aacp"><div class="box" style="border-color:var(--mint)"><h2>🖼️ 그림으로 보는 안내</h2>
    <ul>${[['🔊','소리 버튼을 누르면 읽어줘요'],['✅','확인하면 눌러 주세요'],['🔠','글자를 키울 수 있어요'],['🎒','준비물','']].filter(x=>x.length===2).map(([e,t])=>`<li><span class="aac" style="width:48px;height:48px;font-size:1.6em">${e}</span>${t}</li>`).join('')}</ul>
    <button class="btn m block" id="aacx">알겠어요</button></div></div>`); $('#aacx').onclick=()=>$('#aacp').remove(); }
  else if(a==='switch'){ S.role=null; S.child=null; save(); window.__loginMode=null; render(); }
  else if(a==='reset'){ if(await ask('이 기기의 모든 알림장 정보를 지울까요?')){ localStorage.removeItem(KEY); S=seed(); norm(); S.role=getMode(); window.__loginMode=null; route={p:'home'}; render(); } }
  else if(a==='export'){ const code=btoa(unescape(encodeURIComponent(JSON.stringify({items:S.items,timetable:S.timetable,className:S.className,nextId:S.nextId,centers:S.centers})))); (navigator.clipboard?.writeText(code)||Promise.reject()).then(()=>toast('코드를 복사했어요'),()=>ask('아래 코드를 복사하세요',{input:1,value:code})); }
  else if(a==='import'){ const c=await ask('복사한 코드를 붙여넣으세요',{input:1}); if(!c) return; try{ const d=JSON.parse(decodeURIComponent(escape(atob(c.trim())))); if(!d.items) throw 0; Object.assign(S,{items:d.items,timetable:d.timetable||S.timetable,className:d.className||S.className,nextId:d.nextId||S.nextId,centers:d.centers||S.centers}); save(); toast('가져왔어요'); render(); }catch(e){ toast('코드가 올바르지 않아요'); } }
}

/* ---------- 정기 알림 (앱이 열려 있을 때 + 네이티브 로컬 알림) ---------- */
const lastShown={};
function teacherPopup(){
  if($('#pop')) return;
  const p=pending();
  const body = p.length
   ? `<h2>🌼 학부모 확인 현황</h2><p class="small" style="margin:2px 0 0">아직 확인하지 않은 알림 ${p.length}개</p>
      <ul>${p.slice(0,5).map(i=>`<li style="background:var(--purple-l)"><span class="aac" style="width:48px;height:48px;font-size:1.6em">${esc(i.icon)}</span><span>${esc(i.title)}<br><span class="small" style="font-weight:500">⏳ 아직 확인 전이에요</span></span></li>`).join('')}</ul>`
   : `<h2>✅ 학부모가 모든 알림을 확인했어요</h2><p class="small" style="margin:6px 0 14px">오늘 등록한 알림을 모두 읽고 확인했어요.</p>`;
  document.body.insertAdjacentHTML('beforeend',`<div class="popup" id="pop"><div class="box" style="border-color:var(--purple)">${body}
    <div class="row"><button class="speak" data-speak="tpop" aria-label="읽어주기">🔊</button><button class="btn p block" data-a="tpopclose" style="flex:1">알겠어요</button></div></div></div>`);
  bindCommon();
}
const hmNow=()=>{ const n=new Date(); return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'); };
const PARENT_R=[['work','workTime'],['eve','eveTime'],['bed','bedTime']];
const TEACHER_R=[['leave','tLeave'],['home','tHome'],['wake','tWake'],['pre','tPre']];
function tick(){
  const hm=hmNow();
  if(S.role==='parent'){
    if(!pending().length) return;
    PARENT_R.forEach(([k,tk])=>{ if(S.settings.remind[k] && S.settings[tk]===hm && lastShown['p'+k]!==todayStr()+hm){ lastShown['p'+k]=todayStr()+hm; maybePopup(); } });
  } else if(S.role==='teacher'){
    TEACHER_R.forEach(([k,tk])=>{ if(S.settings.tRemind[k] && S.settings[tk]===hm && lastShown['t'+k]!==todayStr()+hm){ lastShown['t'+k]=todayStr()+hm; teacherPopup(); } });
  }
}
setInterval(tick,20000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) setTimeout(maybePopup,300); });
async function scheduleNative(){
  try{
    const LN=window.Capacitor?.Plugins?.LocalNotifications; if(!LN) return;
    const perm=await LN.requestPermissions(); if(perm.display!=='granted') return;
    const pend=await LN.getPending(); if(pend.notifications.length) await LN.cancel(pend);
    const list=[]; let id=1;
    const teacher=S.role==='teacher';
    (teacher?TEACHER_R:PARENT_R).forEach(([k,tk])=>{
      if(!(teacher?S.settings.tRemind:S.settings.remind)[k]) return; const [h,m]=S.settings[tk].split(':').map(Number);
      list.push({id:id++,title:'🌼 알림봄',body:teacher?'학부모가 알림을 확인했는지 알림봄에서 확인해 보세요.':'아직 확인하지 않은 학교 알림이 있어요. 눌러서 확인해 주세요.',schedule:{on:{hour:h,minute:m},allowWhileIdle:true}});
    });
    if(list.length) await LN.schedule({notifications:list});
  }catch(e){}
}

render();
scheduleNative(); if(S.role==='parent'){ setTimeout(maybePopup,700); }
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
